<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stratosphere - Mobile Flight Tracker</title>
    <link rel="manifest" href="manifest.webmanifest?v=84">
    <meta name="theme-color" content="#0d0e12">
    <link rel="icon" href="favicon.ico?v=84" sizes="any">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png?v=84">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Stratosphere">
    <link rel="stylesheet" href="css/styles.css?v=84">

</head>
<body>

<!-- LOADING SCREEN OVERLAY -->
<div id="loader-overlay">
    <canvas id="load-canvas-el" width="320" height="320"></canvas>
    <div class="load-status-container">
        <div class="load-status-title">Stratosphere</div>
        <div id="load-status-desc" class="load-status-text">INITIALIZING TELEMETRY...</div>
        <div class="load-progress-track">
            <div id="load-progress-bar" class="load-progress-bar"></div>
        </div>
    </div>
</div>

<script src="js/early-gps.js?v=84"></script>
<script src="js/loader.js?v=84"></script>

<div id="app-container">
    <canvas id="map-canvas"></canvas>

    <!-- FLOATING COMPASS (tap to toggle North-Up / Track-Up) -->
    <div id="compass-widget" class="hud-widget" onclick="toggleTrackUp()">
        <div id="compass-rose">
            <div id="compass-arrow">➢</div>
        </div>
    </div>
    <div id="compass-mode-label">North Up</div>

    <!-- RESET VIEW (under the compass) -->
    <div class="zoom-controls">
        <div class="zoom-btn" id="btn-reset-view" onclick="resetView()" style="font-size: 11px;">Reset</div>
    </div>


    <!-- TOP TELEMETRY DRAWER -->
    <div id="top-drawer" class="drawer expanded">
        <div class="controls-header" onclick="toggleDrawer('top-drawer')">
            <div style="display: flex; align-items: center; gap: 6px;">
                <h2>Flight Info</h2>
                <span id="gps-status-dot" title="GPS status" style="font-size: 12px;">🔴</span>
            </div>
            <span id="top-drawer-arrow" style="font-size: 16px; color: var(--accent);">▲</span>
        </div>
        <div class="telemetry-summary" onclick="toggleDrawer('top-drawer')">
            <div>
                <div class="sub-readout">En Route to</div>
                <div class="main-readout" id="lbl-route"><span id="lbl-route-code">---</span><span id="lbl-route-citystate" style="font-size: 13px; font-family: 'Inter', sans-serif; color: var(--text-muted); letter-spacing: normal; margin-left: 6px;"></span></div>
            </div>
            <div style="text-align: right;" onclick="toggleSpeedUnit(event)">
                <div class="sub-readout" id="lbl-speed-title">Airspeed</div>
                <div class="main-readout" id="lbl-summary-speed">0 KTS</div>
            </div>
        </div>
        <div class="telemetry-details">
            <div class="grid-3x2">
                <div class="telemetry-card">
                    <span class="telemetry-label">Heading</span>
                    <span class="telemetry-value" id="val-hdg">360°</span>
                </div>
                <div class="telemetry-card">
                    <span class="telemetry-label">Distance</span>
                    <span class="telemetry-value" id="val-dist">0 NM</span>
                </div>
                <div class="telemetry-card">
                    <span class="telemetry-label">ETA / ETE</span>
                    <span class="telemetry-value" id="val-eta">--:--</span>
                    <span class="telemetry-value" id="val-ete" style="font-size: 14px; opacity: 0.8;">--h --m</span>
                </div>
                <div class="telemetry-card">
                    <span class="telemetry-label">Latitude</span>
                    <span class="telemetry-value" id="val-lat">00.0000°</span>
                </div>
                <div class="telemetry-card">
                    <span class="telemetry-label">Longitude</span>
                    <span class="telemetry-value" id="val-lon">00.0000°</span>
                </div>
                <div class="telemetry-card">
                    <div style="display: flex; align-items: center;">
                        <span class="telemetry-label">~Altitude</span>
                        <span id="altitude-status-dot" title="Altitude fix status (4-satellite 3D lock within last 30s)" style="font-size: 11px; margin-left: 4px;">🔴</span>
                    </div>
                    <span class="telemetry-value" id="val-altitude">--</span>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTTOM CONTROLS DRAWER -->
    <div id="bottom-drawer" class="drawer collapsed">
        <div class="controls-header" onclick="toggleDrawer('bottom-drawer')">
            <h2>Settings</h2>
            <span id="bottom-drawer-arrow" style="font-size: 16px; color: var(--accent);">▲</span>
        </div>
        <div class="controls-content">
            <div class="input-group">
                <label class="input-label">Select Destination Airport</label>
                <select id="sel-airport" autocomplete="off" onchange="handleAirportSelect()">
                    <!-- Populated dynamically in Part 2 -->
                </select>
            </div>

            <div class="input-group" style="margin-top: 8px;">
                <label class="input-label">Map Layers</label>
                <div class="toggle-row" style="grid-template-columns: 1fr 1fr;">
                    <button id="btn-toggle-landmarks" class="btn" onclick="toggleLandmarks()">Landmarks</button>
                    <button id="btn-toggle-airports" class="btn" onclick="toggleAirports()">Airports</button>
                </div>
                <div class="toggle-row" style="grid-template-columns: 1fr 1fr; margin-top: 8px;">
                    <button id="btn-toggle-terminator" class="btn" onclick="toggleTerminator()">🌓 Terminator</button>
                    <button id="btn-toggle-seasonal" class="btn" onclick="toggleSeasonalColors()">🍂 Seasonal</button>
                </div>
                <div class="toggle-row" style="grid-template-columns: 1fr; margin-top: 8px;">
                    <button id="btn-toggle-callouts" class="btn active" onclick="toggleCallouts()">Landmark callouts</button>
                </div>
            </div>

            <div class="input-group" style="margin-top: 8px;">
                <label class="input-label">Home Location 🏠</label>
                <div class="toggle-row" style="grid-template-columns: 1fr 1fr; gap: 6px;">
                    <input type="number" id="input-home-lat" class="btn" style="text-align:center;" placeholder="Latitude" step="any" oninput="handleHomeLocationChange()">
                    <input type="number" id="input-home-lon" class="btn" style="text-align:center;" placeholder="Longitude" step="any" oninput="handleHomeLocationChange()">
                </div>
                <div class="toggle-row" style="grid-template-columns: 1fr; margin-top: 6px;">
                    <button id="btn-home-use-gps" class="btn" onclick="useCurrentLocationAsHome()">📍 Use my current location</button>
                </div>
                <div id="home-gps-status" style="font-size: 11px; color: var(--text-muted); margin-top: 4px; min-height: 14px;"></div>
                <label style="display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--text-muted); cursor: pointer;">
                    <input type="checkbox" id="chk-home-show" onchange="handleHomeLocationChange()">
                    Show on map
                </label>
            </div>

            <div class="input-group" style="margin-top: 8px;">
                <label class="input-label">Testing</label>
                <div class="toggle-row" style="grid-template-columns: 1fr 1fr;">
                    <button id="btn-test-takeoff" class="btn" onclick="playCutscene('takeoff')">🛫 Takeoff</button>
                    <button id="btn-test-landing" class="btn" onclick="playCutscene('landing')">🛬 Landing</button>
                </div>
                <div class="toggle-row" style="grid-template-columns: 2fr 1fr; margin-top: 8px; gap: 6px;">
                    <input type="date" id="input-seasonal-date" class="btn" style="text-align:center;" onchange="handleSeasonalDateOverride()">
                    <button id="btn-seasonal-date-reset" class="btn" onclick="resetSeasonalDate()">Today</button>
                </div>
            </div>

            <div class="input-group" style="margin-top: 8px;">
                <label class="input-label">Altitude diagnostics</label>
                <div id="alt-diag" style="font: 10px/1.5 monospace; color: var(--text-muted); white-space: pre; overflow-x: auto;"></div>
            </div>

            <div class="input-group" style="margin-top: 8px;">
                <label class="input-label">Display Mode</label>
                <div id="daynight-toggle" class="daynight-toggle night">
                    <div id="daynight-toggle-highlight" class="daynight-toggle-highlight"></div>
                    <button type="button" class="daynight-toggle-option" onclick="setDayNightMode(true)" aria-label="Day mode">☀️</button>
                    <button type="button" class="daynight-toggle-option" onclick="setDayNightMode(false)" aria-label="Night mode">🌙</button>
                </div>
            </div>

            <div class="input-group" style="margin-top: 8px;">
                <label class="input-label">State Border Color</label>
                <select id="sel-border-color" onchange="handleBorderColorSelect()">
                    <option value="white">White</option>
                    <option value="lightgray">Light Gray</option>
                    <option value="black">Black</option>
                    <option value="gold" selected>Gold</option>
                    <option value="snowwhite">Snow White</option>
                </select>
            </div>
        </div>
    </div>

    <!-- LANDMARK CALLOUT BANNER (see js/callouts.js) -->
    <div id="landmark-callout" onclick="dismissCallout()"></div>

    <!-- TAKEOFF / LANDING CUTSCENE CARD -->
    <!-- Covers the bottom half of the screen (including the Settings drawer
         area) while a cutscene plays. Built and torn down by playCutscene()
         in the main script below; see the big comment block there for the
         full stage-by-stage timing spec. -->
    <div id="cutscene-card">
        <canvas id="cutscene-blob-canvas"></canvas>
        <span id="cutscene-runway-marker-start" class="cutscene-runway-marker">≡</span>
        <div id="cutscene-runway">
            <div id="cutscene-runway-dashes"></div>
        </div>
        <span id="cutscene-runway-marker-end" class="cutscene-runway-marker">≡</span>
        <div id="cutscene-plane">✈️</div>
    </div>
</div>

<div id="airport-popup-overlay" style="position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; display: none; align-items: center; justify-content: center;" onclick="if (event.target === this) closeAirportPopup();">
    <div id="airport-popup-panel" style="background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; width: 92vw; max-width: 480px; height: 78vh; max-height: 620px; display: flex; flex-direction: column; overflow: hidden;">
        <div style="position: relative; padding: 10px 40px 10px 14px; border-bottom: 1px solid var(--panel-border); flex-shrink: 0; box-sizing: border-box;">
            <div id="airport-popup-title" style="font-size: 12px; font-weight: 600; color: var(--text-primary); line-height: 1.3;"></div>
            <button onclick="closeAirportPopup()" style="position: absolute; top: 0; right: 0; width: 48px; height: 100%; background: none; border: none; font-size: 22px; color: var(--text-muted); cursor: pointer; padding: 0; line-height: 1;">&times;</button>
        </div>
        <canvas id="airport-popup-canvas" style="flex: 1; width: 100%; display: block;"></canvas>
    </div>
</div>

<script src="js/drawers.js?v=84"></script>
<script src="js/state.js?v=84"></script>
<script src="js/data/map-data.js?v=84"></script>
<script src="js/data/airport-data.js?v=84"></script>
<script src="js/airports.js?v=84"></script>
<script src="js/projection.js?v=84"></script>
<script src="js/canvas.js?v=84"></script>
<script src="js/seasonal.js?v=84"></script>
<script src="js/touch.js?v=84"></script>
<script src="js/airport-popup.js?v=84"></script>
<script src="js/geodesy.js?v=84"></script>
<script src="js/render-loop.js?v=84"></script>
<script src="js/terminator.js?v=84"></script>
<script src="js/live-layer.js?v=84"></script>
<script src="js/telemetry.js?v=84"></script>
<script src="js/cutscene.js?v=84"></script>
<script src="js/controls.js?v=84"></script>
<script src="js/callouts.js?v=84"></script>
<script src="js/register-sw.js?v=84"></script>
</body>
</html>
